<html>
<head>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

     body {
     	background-color: 	#51a687;
     }

    
</style>
</head>
<body>
   <br><br> <center> <h4 style="color: white; background-color: #06170e; width: 20%; font-family: Courier New; "> Hi! I am Timmy, the magic calculator! Lets go and do some math!</h4>
     <div class="container" style="background-color: #05472A; width: 30%; display: inline-block;"><br>
      

<div class="container" style="width: 50%; height: 25%; display: inline-block;" >
     <img src="calcu.png" style="width: 120%; height: 120%;">
     </div>
    
     <br>
       
       <h5 style="text-align: left; color:white">GIVEN:</h5>

   <form> 

	<h5 style="color:white;"> Enter value for A: </h5> 
	
			<input type="number" id="num1" placeholder="" style="border-color: white; border-radius: 5px;">

<br> 

	<h5 style="color: white;"> Enter value for B: </h5>
			<input type="number" id="num2" placeholder=""style="border-color: white; border-radius: 5px;">

<br><br>
	<details ontoggle="message()">
		<summary style="color:white;"> Instructions </summary>
		<i style="color:white;"> Enter 2 numbers, click on the buttons below to find its product, <br> remainder, the answer of A raised to B, and if the numbers are equal. </i>



		</details> 	
<br><br>
			<button type="button" class="btn btn-primary" onclick = "multiply()"> product of A and B</button>
		<h4	id="Result"></h4> <br>
		<button type="button" class="btn btn-warning" onclick = "remainder()"> get the remainder</button>
		<h4	id=" result"></h4>
<br>

		<button type="button" class="btn btn-info" onclick = "exponential()"> A raised to B</button>
		<h4	id=" rEseult"></h4>

<br>

<button type="button" class="btn btn-danger" onclick = "equal()"> check if A=B?</button>
		<h4	id=" resulT"></h4>


		</form>
     </div>

<script> 
	function message(){
	alert("Try it");	
	}

	function multiply(){
	 var minus1 = document.getElementById ("num1").value
	 var minus2 = document.getElementById ("num2").value;
      var ans = Number(minus1)* Number(minus2);

        document.getElementById('Result').innerHTML = 'Answer is' + '' + ans; 

	}


	function remainder(){
	 var minus1 = document.getElementById ("num1").value
	 var minus2 = document.getElementById ("num2").value;
      var ans = Number(minus1)%  Number(minus2);

        document.getElementById(' result').innerHTML = 'Answer is' + '' + ans; 

	}


	function exponential(){
	 var minus1 = document.getElementById ("num1").value
	 var minus2 = document.getElementById ("num2").value;
      var ans = Number(minus1)**Number(minus2);   

        document.getElementById(' rEseult').innerHTML = 'Answer is' + '' + ans; 

	}


	function equal(){
	 var minus1 = document.getElementById ("num1").value
	 var minus2 = document.getElementById ("num2").value;
      var ans = Number(minus1)==   Number(minus2);

        document.getElementById(' resulT').innerHTML = 'Answer is' + '' + ans; 

	}
</script>
